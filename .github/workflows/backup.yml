name: Backup

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Backup to GitHub
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');
            const { context } = require('@actions/github');

            const backupDir = path.join(process.cwd(), 'backup');
            if (!fs.existsSync(backupDir)) {
              fs.mkdirSync(backupDir);
            }

            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const backupFile = path.join(backupDir, `backup-${timestamp}.zip`);

            execSync(`zip -r ${backupFile} . -x "node_modules/*" ".git/*" "backup/*"`);

            const octokit = new Octokit({
              auth: process.env.GITHUB_TOKEN
            });

            await octokit.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `backup-${timestamp}`,
              name: `Backup ${timestamp}`,
              body: 'Automated backup of the repository',
              draft: false,
              prerelease: false
            });

            await octokit.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              name: `backup-${timestamp}.zip`,
              data: fs.readFileSync(backupFile)
            });

      - name: Backup to S3
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync backup s3://${{ secrets.AWS_BUCKET_NAME }}/backups/$(date +%Y-%m-%d)/ 