name: Analytics

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analytics:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Google Analytics check
        uses: treosh/google-analytics-check-action@v1
        with:
          propertyId: ${{ secrets.GA_PROPERTY_ID }}
          viewId: ${{ secrets.GA_VIEW_ID }}
          startDate: '7daysAgo'
          endDate: 'today'
          metrics: 'ga:sessions,ga:users,ga:pageviews,ga:avgSessionDuration,ga:bounceRate'
          dimensions: 'ga:date,ga:source,ga:medium,ga:campaign'
          reporter: 'json'
          reporterOutput: 'ga-results.json'

      - name: Run Google Search Console check
        uses: treosh/google-search-console-check-action@v1
        with:
          siteUrl: ${{ secrets.GSC_SITE_URL }}
          startDate: '7daysAgo'
          endDate: 'today'
          dimensions: 'date,query,page,device,country'
          reporter: 'json'
          reporterOutput: 'gsc-results.json' 